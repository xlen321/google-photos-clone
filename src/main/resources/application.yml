spring:
  application:
    name: google_photos

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URI}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true
        jdbc:
          '[time_zone]': UTC

  devtools:
    restart:
      enabled: true
      exclude: static/**


logging:
  level:
    root: INFO
    com:
      example:
        '[prod_ready_features]':
          services: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %m%n"

management:
  endpoints:
    web:
      exposure:
        include: "*"


app:
  jwt:
    secret: ${JWT_SECRET_KEY}
    '[access_token_expiration]': 900000 # 15 minutes
    '[refresh_token_expiration]': 604800000 # 7 days
